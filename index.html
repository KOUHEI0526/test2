
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備蓄診断ツール</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  line-height: 1.8;
}

/* 見出し */
h1 {
  margin-bottom: 10px;
}

/* ステップ制御 */
.step {
  display: none;
}
.active {
  display: block;
}

/* 入力 */
select, input {
  margin-top: 5px;
  padding: 8px;
  font-size: 16px;
}

/* ボタン（重要） */
button {
  padding: 14px 18px;
  margin-top: 12px;
  margin-right: 8px;
  cursor: pointer;
  font-size: 16px;
  border-radius: 6px;
  border: none;
}

/* 進むボタンを赤に */
button.next {
  background-color: #e60033;
  color: #fff;
  font-weight: bold;
}

/* 結果 */
.result-box {
  border-radius: 8px;
  padding: 16px;
  margin-top: 12px;
  background: #fafafa;
}

/* レベル色 */
.level-danger {
  border: 2px solid red;
}
.level-warning {
  border: 2px solid orange;
}
.level-safe {
  border: 2px solid green;
}

.link-box {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #ddd;
}

.link-button {
  display: inline-block;
  margin-top: 8px;
  padding: 12px 18px;
  background-color: #e60033;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>30秒で分かる！備蓄レベル診断</h1>
<p>質問に答えるだけで、不足している備蓄品がすぐ分かります</p>

<!-- STEP1 -->
<div id="step1" class="step active">
  <h2>① 世帯人数</h2>
  <input type="number" id="people" value="1" min="1" max="9"><br>
  <button class="next" onclick="nextStep(2)">次へ</button>
</div>

<!-- STEP2 -->
<div id="step2" class="step">
  <h2>② 性別・年代</h2>
  <div id="persons"></div>
  <button onclick="nextStep(1)">戻る</button>
  <button class="next" onclick="nextStep(3)">次へ</button>
</div>

<!-- STEP3 -->
<div id="step3" class="step">
  <h2>③ 備えチェック</h2>

  <p>家具転倒対策</p>
  <select id="furniture">
    <option value="yes">している</option>
    <option value="no">していない</option>
  </select>

  <p>水・食料</p>
  <select id="foodWater">
    <option value="full">3日分以上</option>
    <option value="partial">1〜2日分</option>
    <option value="none">なし</option>
  </select>

  <p>簡易トイレ</p>
  <select id="toilet">
    <option value="full">3日分以上</option>
    <option value="partial">1〜2日分</option>
    <option value="none">なし</option>
  </select>

  <p>連絡手段</p>
  <select id="contact">
    <option value="yes">決めている</option>
    <option value="no">決めていない</option>
  </select>

  <br>
  <button onclick="nextStep(2)">戻る</button>
  <button class="next" onclick="nextStep(4)">結果を見る</button>
</div>

<!-- STEP4 -->
<div id="step4" class="step">
  <h2>④ 診断結果</h2>
  <div id="result"></div>
</div>

<script>
let personsData = [];

/* 人物保存 */
function savePersons() {
  const count = Number(document.getElementById("people").value);
  personsData = [];

  for (let i = 0; i < count; i++) {
    personsData.push({
      gender: document.getElementById("gender" + i).value,
      age: document.getElementById("age" + i).value
    });
  }
}

/* 入力UI生成 */
function createPersons() {
  const count = Number(document.getElementById("people").value);
  const div = document.getElementById("persons");
  div.innerHTML = "";

  for (let i = 0; i < count; i++) {
    div.innerHTML += `
      <p>${i + 1}人目</p>
      性別：
      <select id="gender${i}">
        <option value="male">男性</option>
        <option value="female">女性</option>
      </select>
      年代：
      <select id="age${i}">
        <option value="baby">乳幼児</option>
        <option value="child">子供</option>
        <option value="adult">成人</option>
        <option value="elder">高齢者</option>
      </select>
      <hr>
    `;
  }
}

/* ページ遷移 */
function nextStep(step) {
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById("step" + step).classList.add("active");

  window.scrollTo(0,0);

  if (step === 2) createPersons();
  if (step === 4) calc();
}

/* 計算ロジック */
function calc() {
  savePersons();

  const count = Number(document.getElementById("people").value);

  let score = 0;
  let list = [];

  let water = count * 9;
  let food = count * 3;

  personsData.forEach(p => {
    if (p.age === "baby") list.push("粉ミルク・おむつ");
    if (p.age === "elder") list.push("常備薬");
    if (p.gender === "female") list.push("生理用品");
  });

  if (document.getElementById("furniture").value === "yes") score++; else list.push("家具固定");
  if (document.getElementById("foodWater").value === "full") score+=2; else list.push("水・食料");
  if (document.getElementById("toilet").value === "full") score+=2; else list.push("簡易トイレ");
  if (document.getElementById("contact").value === "yes") score++; else list.push("連絡方法");

  list = [...new Set(list)];

  let level = "";
  let msg = "";
  let className = "";

  if (score <= 2) {
    level = "危険";
    msg = "今すぐ備蓄を見直してください";
    className = "level-danger";
  } else if (score <= 4) {
    level = "要改善";
    msg = "あと少しで安心です";
    className = "level-warning";
  } else {
    level = "安心";
    msg = "しっかり備えています";
    className = "level-safe";
  }

  document.getElementById("result").innerHTML = `
    <div class="result-box ${className}">
      <h3>あなたの備蓄レベル：${level}</h3>
      <p>${msg}</p>

      水：${water}L<br>
      食料：${food}日分<br><br>

      <strong>不足しているもの</strong><br>
      ${list.join("<br>")}<br><br>

      <div class="link-box">
        <strong>今すぐ備蓄を確認しましょう</strong><br>

        <a class="link-button" href="pdf/stock.pdf" target="_blank">
          備蓄チェックシートを見る
        </a>

        <p style="font-size:12px;">開けない場合はこちら</p>
        <a href="pdf/stock.pdf" target="_blank">
          PDFを直接開く
        </a>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
