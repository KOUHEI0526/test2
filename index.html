

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備蓄診断ツール</title>

<style>
body {
  font-family: sans-serif;
  padding: 20px;
  line-height: 1.8;
  background-color: #f5f7fa;
  max-width: 600px;
  margin: auto;
}

/* タイトル */
h1 {
  color: #e60033;
}

/* カード */
.step {
  display: none;
  background: white;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}
.active { display: block; }

/* 入力 */
select, input {
  margin-top: 5px;
  padding: 10px;
  font-size: 16px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* ボタン */
button {
  padding: 14px 18px;
  margin-top: 12px;
  margin-right: 8px;
  cursor: pointer;
  font-size: 16px;
  border-radius: 6px;
  border: none;
  background: #ddd;
}

button.next {
  background-color: #e60033;
  color: white;
  font-weight: bold;
}

/* 結果 */
.result-box {
  border-radius: 10px;
  padding: 18px;
  margin-top: 12px;
  background: #fff;
}

/* レベル色 */
.level-danger {
  background: #ffe5e5;
  border-left: 6px solid red;
}
.level-warning {
  background: #fff7e6;
  border-left: 6px solid orange;
}
.level-safe {
  background: #e8f7e8;
  border-left: 6px solid green;
}

/* リンク */
.link-box {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid #ddd;
}

.link-button {
  display: inline-block;
  margin-top: 8px;
  padding: 12px 18px;
  background-color: #e60033;
  color: #fff;
  text-decoration: none;
  border-radius: 6px;
  font-weight: bold;
}
</style>
</head>

<body>

<h1>30秒で分かる！備蓄レベル診断</h1>
<p>不足している備蓄と必要量がすぐ分かります</p>

<!-- STEP1 -->
<div id="step1" class="step active">
  <h2>① 世帯人数</h2>
  <input type="number" id="people" value="1" min="1" max="9"><br>
  <button class="next" onclick="nextStep(2)">次へ</button>
</div>

<!-- STEP2 -->
<div id="step2" class="step">
  <h2>② 性別・年代</h2>
  <div id="persons"></div>
  <button onclick="nextStep(1)">戻る</button>
  <button class="next" onclick="nextStep(3)">次へ</button>
</div>

<!-- STEP3 -->
<div id="step3" class="step">
  <h2>③ 備えチェック</h2>

  <p>家具転倒対策</p>
  <select id="furniture">
    <option value="yes">している</option>
    <option value="no">していない</option>
  </select>

  <p>水・食料</p>
  <select id="foodWater">
    <option value="full">3日分以上</option>
    <option value="partial">1〜2日分</option>
    <option value="none">なし</option>
  </select>

  <p>簡易トイレ</p>
  <select id="toilet">
    <option value="full">3日分以上</option>
    <option value="partial">1〜2日分</option>
    <option value="none">なし</option>
  </select>

  <p>連絡手段</p>
  <select id="contact">
    <option value="yes">決めている</option>
    <option value="no">決めていない</option>
  </select>

  <br>
  <button onclick="nextStep(2)">戻る</button>
  <button class="next" onclick="nextStep(4)">結果を見る</button>
</div>

<!-- RESULT -->
<div id="step4" class="step">
  <h2>④ 診断結果</h2>
  <div id="result"></div>
</div>

<script>
let personsData = [];

function savePersons() {
  const count = Number(document.getElementById("people").value);
  personsData = [];

  for (let i = 0; i < count; i++) {
    personsData.push({
      gender: document.getElementById("gender" + i).value,
      age: document.getElementById("age" + i).value
    });
  }
}

function createPersons() {
  const count = Number(document.getElementById("people").value);
  const div = document.getElementById("persons");
  div.innerHTML = "";

  for (let i = 0; i < count; i++) {
    div.innerHTML += `
      <p>${i + 1}人目</p>
      性別：
      <select id="gender${i}">
        <option value="male">男性</option>
        <option value="female">女性</option>
      </select>
      年代：
      <select id="age${i}">
        <option value="baby">乳幼児</option>
        <option value="child">子供</option>
        <option value="adult">成人</option>
        <option value="elder">高齢者</option>
      </select>
      <hr>
    `;
  }
}

function nextStep(step) {
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.getElementById("step" + step).classList.add("active");
  window.scrollTo(0,0);

  if (step === 2) createPersons();
  if (step === 4) calc();
}

function calc() {
  savePersons();
  const count = Number(document.getElementById("people").value);

  let score = 0;
  let detail = [];

  if (document.getElementById("furniture").value === "yes") score++;
  else detail.push("家具固定（転倒防止）");

  if (document.getElementById("foodWater").value === "full") score+=2;
  else {
    detail.push(`水：約${count*9}L（3日分）`);
    detail.push(`食料：約${count*9}食`);
  }

  if (document.getElementById("toilet").value === "full") score+=2;
  else detail.push(`簡易トイレ：約${count*15}回分`);

  if (document.getElementById("contact").value === "yes") score++;
  else detail.push("連絡手段の確認");

  let level = "", msg="", cls="";

  if (score <=2){ level="危険"; msg="今すぐ対策が必要です"; cls="level-danger";}
  else if(score<=4){ level="要改善"; msg="あと少しです"; cls="level-warning";}
  else{ level="安心"; msg="しっかり備えています"; cls="level-safe"; }

  document.getElementById("result").innerHTML = `
    <div class="result-box ${cls}">
      <h3>あなたの備蓄レベル：${level}</h3>
      <p>${msg}</p>

      <strong>必要量（目安）</strong><br>
      水：${count*9}L / 食料：${count*9}食<br><br>

      <strong>不足しているもの</strong><br>
      ${detail.join("<br>")}<br><br>

      <div class="link-box">
        <a class="link-button" href="pdf/stock.pdf" target="_blank">
          備蓄チェックシートを見る
        </a>
      </div>
    </div>
  `;
}
</script>

</body>
</html>
