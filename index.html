<!DOCTYPE html>
<!-- saved from url=(0059)file:///C:/Users/226321/Downloads/bichiku_shindan_tool.html -->
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30秒で分かる！備蓄レベル診断</title>

<style>
  :root {
    --main: #e60033;
    --main-dark: #b80028;
    --bg: #f5f7fa;
    --text: #333333;
    --muted: #666666;
    --border: #dddddd;
    --safe-bg: #e8f7e8;
    --safe-line: #168a35;
    --warn-bg: #fff7e6;
    --warn-line: #f0a000;
    --danger-bg: #ffe5e5;
    --danger-line: #e00000;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    margin: 0;
    padding: 20px;
    line-height: 1.8;
    background-color: var(--bg);
    color: var(--text);
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    color: var(--main);
    line-height: 1.4;
    margin: 0 0 10px;
    font-size: 1.8rem;
  }

  h2 {
    margin-top: 0;
    font-size: 1.35rem;
  }

  h3 {
    margin-top: 0;
    font-size: 1.25rem;
  }

  p {
    margin: 0 0 12px;
  }

  .lead {
    background: #ffffff;
    padding: 16px 18px;
    border-left: 6px solid var(--main);
    border-radius: 10px;
    margin: 16px 0 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .small-text {
    font-size: 0.92rem;
    color: var(--muted);
  }

  .step {
    display: none;
    background: #ffffff;
    padding: 22px;
    border-radius: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }

  .active {
    display: block;
  }

  label {
    font-weight: bold;
    display: inline-block;
    margin-top: 8px;
  }

  select,
  input {
    width: 100%;
    margin-top: 6px;
    margin-bottom: 12px;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #cccccc;
    background: #ffffff;
  }

  input[type="number"] {
    max-width: 140px;
  }

  button {
    padding: 13px 18px;
    margin-top: 12px;
    margin-right: 8px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    background: #dddddd;
    color: #222222;
  }

  button.next {
    background-color: var(--main);
    color: #ffffff;
    font-weight: bold;
  }

  button:hover,
  .link-button:hover {
    opacity: 0.88;
  }

  .person-card {
    padding: 14px;
    margin-bottom: 14px;
    background: #f9fafc;
    border-radius: 10px;
    border: 1px solid #e0e0e0;
  }

  .person-card-title {
    font-weight: bold;
    margin-bottom: 8px;
  }

  .result-box {
    border-radius: 12px;
    padding: 20px;
    margin-top: 12px;
    background: #ffffff;
  }

  .level-danger {
    background: var(--danger-bg);
    border-left: 7px solid var(--danger-line);
  }

  .level-warning {
    background: var(--warn-bg);
    border-left: 7px solid var(--warn-line);
  }

  .level-safe {
    background: var(--safe-bg);
    border-left: 7px solid var(--safe-line);
  }

  .note-box {
    margin-top: 14px;
    padding: 14px;
    background: rgba(255,255,255,0.65);
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 10px;
  }

  .warning-text {
    color: #9b001f;
    font-weight: bold;
  }

  .section-title {
    font-weight: bold;
    margin-top: 16px;
    margin-bottom: 6px;
  }

  .link-box {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(0,0,0,0.15);
  }

  .link-button {
    display: inline-block;
    margin-top: 8px;
    padding: 12px 18px;
    background-color: var(--main);
    color: #ffffff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
  }

  .error-message {
    display: none;
    color: #b00020;
    font-weight: bold;
    margin-top: 8px;
  }

  hr {
    border: 0;
    border-top: 1px solid rgba(0,0,0,0.12);
    margin: 18px 0;
  }

  @media (max-width: 480px) {
    body {
      padding: 14px;
    }

    h1 {
      font-size: 1.5rem;
    }

    .step {
      padding: 18px;
    }

    button {
      width: 100%;
      margin-right: 0;
    }
  }
</style>
</head>

<body>
<div class="container">

  <h1>30秒で分かる！備蓄レベル診断</h1>

  <div class="lead">
    <p>この診断では、世帯人数や家族構成に応じて、災害時に必要な備蓄の目安を確認できます。</p>
    <p class="small-text">※ まずは最低3日分、可能であれば7日分の備蓄を目指しましょう。</p>
  </div>

  <!-- STEP1 -->
  <div id="step1" class="step active">
    <h2>① 世帯人数</h2>

    <label for="people">世帯人数を入力してください</label><br>
    <input type="number" id="people" value="1" min="1" max="9" inputmode="numeric">
    <p class="small-text">※ 1〜9人の範囲で入力してください。</p>
    <p id="peopleError" class="error-message">世帯人数は1〜9人で入力してください。</p>

    <button class="next" type="button" onclick="nextStep(2)">次へ</button>
  </div>

  <!-- STEP2 -->
  <div id="step2" class="step">
    <h2>② 性別・年代</h2>
    <p>家族構成に応じて、追加で必要になりやすい備蓄品を確認します。</p>

    <div id="persons"></div>

    <button type="button" onclick="nextStep(1)">戻る</button>
    <button class="next" type="button" onclick="nextStep(3)">次へ</button>
  </div>

  <!-- STEP3 -->
  <div id="step3" class="step">
    <h2>③ 備えチェック</h2>

    <label for="furniture">家具転倒対策</label><br>
    <select id="furniture">
      <option value="yes">している</option>
      <option value="no">していない</option>
    </select>

    <label for="foodWater">水・食料</label><br>
    <select id="foodWater">
      <option value="full">3日分以上ある</option>
      <option value="partial">1〜2日分ある</option>
      <option value="none">ほとんどない・ない</option>
    </select>

    <label for="toilet">簡易トイレ</label><br>
    <select id="toilet">
      <option value="full">3日分以上ある</option>
      <option value="partial">1〜2日分ある</option>
      <option value="none">ほとんどない・ない</option>
    </select>

    <label for="contact">家族・同居者との連絡手段</label><br>
    <select id="contact">
      <option value="yes">決めている</option>
      <option value="no">決めていない</option>
    </select>

    <button type="button" onclick="nextStep(2)">戻る</button>
    <button class="next" type="button" onclick="nextStep(4)">結果を見る</button>
  </div>

  <!-- RESULT -->
  <div id="step4" class="step">
    <h2>④ 診断結果</h2>
    <div id="result"></div>

    <button type="button" onclick="nextStep(3)">戻る</button>
    <button class="next" type="button" onclick="restart()">最初から診断する</button>
  </div>

</div>

<script>
let personsData = [];

function getPeopleCount() {
  const input = document.getElementById("people");
  const error = document.getElementById("peopleError");
  let count = Number(input.value);

  if (!Number.isInteger(count) || count < 1 || count > 9) {
    error.style.display = "block";
    count = Math.min(Math.max(Math.floor(count || 1), 1), 9);
    input.value = count;
  } else {
    error.style.display = "none";
  }

  return count;
}

function savePersons() {
  const count = getPeopleCount();
  const saved = [];

  for (let i = 0; i < count; i++) {
    const genderEl = document.getElementById("gender" + i);
    const ageEl = document.getElementById("age" + i);

    saved.push({
      gender: genderEl ? genderEl.value : (personsData[i] ? personsData[i].gender : "other"),
      age: ageEl ? ageEl.value : (personsData[i] ? personsData[i].age : "adult")
    });
  }

  personsData = saved;
}

function createPersons() {
  const count = getPeopleCount();
  const div = document.getElementById("persons");
  div.innerHTML = "";

  for (let i = 0; i < count; i++) {
    const currentGender = personsData[i] ? personsData[i].gender : "other";
    const currentAge = personsData[i] ? personsData[i].age : "adult";

    div.insertAdjacentHTML("beforeend", `
      <div class="person-card">
        <div class="person-card-title">${i + 1}人目</div>

        <label for="gender${i}">性別</label><br>
        <select id="gender${i}">
          <option value="male" ${currentGender === "male" ? "selected" : ""}>男性</option>
          <option value="female" ${currentGender === "female" ? "selected" : ""}>女性</option>
          <option value="other" ${currentGender === "other" ? "selected" : ""}>回答しない・その他</option>
        </select>

        <label for="age${i}">年代</label><br>
        <select id="age${i}">
          <option value="baby" ${currentAge === "baby" ? "selected" : ""}>乳幼児</option>
          <option value="child" ${currentAge === "child" ? "selected" : ""}>子供</option>
          <option value="adult" ${currentAge === "adult" ? "selected" : ""}>成人</option>
          <option value="elder" ${currentAge === "elder" ? "selected" : ""}>高齢者</option>
        </select>
      </div>
    `);
  }
}

function showStep(step) {
  document.querySelectorAll(".step").forEach(function(section) {
    section.classList.remove("active");
  });

  document.getElementById("step" + step).classList.add("active");
  window.scrollTo(0, 0);
}

function nextStep(step) {
  const activeStep = document.querySelector(".step.active");

  if (activeStep && activeStep.id === "step2") {
    savePersons();
  }

  if (step === 2) {
    createPersons();
  }

  if (step === 3) {
    savePersons();
  }

  if (step === 4) {
    calc();
  }

  showStep(step);
}

function calc() {
  savePersons();

  const count = getPeopleCount();

  const furniture = document.getElementById("furniture").value;
  const foodWater = document.getElementById("foodWater").value;
  const toilet = document.getElementById("toilet").value;
  const contact = document.getElementById("contact").value;

  const neededWater3days = count * 9;
  const neededFood3days = count * 9;
  const neededToilet3days = count * 15;

  const recommendedWater7days = count * 21;
  const recommendedFood7days = count * 21;
  const recommendedToilet7days = count * 35;

  let score = 0;
  const maxScore = 7;

  const shortage = [];
  const advice = [];
  const personalItems = [];

  if (furniture === "yes") {
    score += 2;
  } else {
    shortage.push("家具固定・転倒防止対策");
    advice.push("地震によるケガを防ぐため、棚・タンス・テレビなどの固定を行いましょう。");
  }

  if (foodWater === "full") {
    score += 2;
  } else if (foodWater === "partial") {
    score += 1;
    shortage.push(`水：あと約${count * 3}L〜${count * 6}Lを追加すると3日分に近づきます`);
    shortage.push(`食料：あと約${count * 3}食〜${count * 6}食を追加すると3日分に近づきます`);
    advice.push("1〜2日分の備蓄がある場合も、まずは最低3日分を目標に少しずつ追加しましょう。");
  } else {
    shortage.push(`水：約${neededWater3days}Lを目安に準備しましょう`);
    shortage.push(`食料：約${neededFood3days}食を目安に準備しましょう`);
    advice.push("水と食料は最優先で備えたい項目です。まずは3日分を確保しましょう。");
  }

  if (toilet === "full") {
    score += 2;
  } else if (toilet === "partial") {
    score += 1;
    shortage.push(`簡易トイレ：あと約${count * 5}回分〜${count * 10}回分を追加すると3日分に近づきます`);
    advice.push("断水時はトイレが使えない場合があります。簡易トイレも水・食料と同じくらい重要です。");
  } else {
    shortage.push(`簡易トイレ：約${neededToilet3days}回分を目安に準備しましょう`);
    advice.push("簡易トイレは1人1日5回×3日分を目安に備えましょう。");
  }

  if (contact === "yes") {
    score += 1;
  } else {
    shortage.push("家族・同居者との連絡方法や集合場所の確認");
    advice.push("災害時は電話がつながりにくくなる場合があります。安否確認方法や集合場所を事前に決めておきましょう。");
  }

  const hasBaby = personsData.some(function(person) { return person.age === "baby"; });
  const hasChild = personsData.some(function(person) { return person.age === "child"; });
  const hasElder = personsData.some(function(person) { return person.age === "elder"; });
  const hasFemale = personsData.some(function(person) { return person.gender === "female"; });

  if (hasBaby) {
    personalItems.push("乳幼児向け：おむつ、おしりふき、粉ミルクまたは液体ミルク、離乳食、母子手帳の写し");
  }

  if (hasChild) {
    personalItems.push("子供向け：食べ慣れたお菓子、着替え、子供用マスク、安心できる小物");
  }

  if (hasElder) {
    personalItems.push("高齢者向け：常備薬、お薬手帳の写し、眼鏡、補聴器用電池、介護用品");
  }

  if (hasFemale) {
    personalItems.push("女性向け：生理用品、サニタリー袋など");
  }

  if (personalItems.length === 0) {
    personalItems.push("家族構成に応じた特別な追加項目はありません。必要に応じて常備薬や眼鏡などを確認してください。");
  }

  let level = "";
  let msg = "";
  let cls = "";

  if (score <= 2) {
    level = "要注意";
    msg = "災害時に困る可能性があります。まずは水・食料・簡易トイレ・家具固定から優先して見直しましょう。";
    cls = "level-danger";
  } else if (score <= 5) {
    level = "要改善";
    msg = "基本的な備えは一部できています。不足している項目を見直し、最低3日分の備蓄を目指しましょう。";
    cls = "level-warning";
  } else {
    level = "概ね良好";
    msg = "基本的な備えはできています。今後は7日分を目安に備蓄を充実させましょう。";
    cls = "level-safe";
  }

  const shortageHtml = shortage.length === 0
    ? "不足項目はありません。賞味期限・使用期限・保管場所は定期的に確認しましょう。"
    : shortage.join("<br>");

  const adviceHtml = advice.length === 0
    ? "現時点では大きな不足は見られません。定期的な点検と、7日分への拡充を検討しましょう。"
    : advice.join("<br>");

  document.getElementById("result").innerHTML = `
    <div class="result-box ${cls}">
      <h3>あなたの備蓄レベル：${level}</h3>
      <p><strong>スコア：${score} / ${maxScore} 点</strong></p>
      <p>${msg}</p>

      <p class="warning-text">
        大規模災害発生時は、公的支援が届くまで数日以上かかる可能性があります。まずは最低3日分、可能であれば7日分の備蓄を目指しましょう。
      </p>

      <hr>

      <div class="section-title">最低限必要な備蓄量（3日分目安）</div>
      水：約${neededWater3days}L<br>
      食料：約${neededFood3days}食<br>
      簡易トイレ：約${neededToilet3days}回分

      <div class="note-box">
        <strong>推奨備蓄量（7日分目安）</strong><br>
        水：約${recommendedWater7days}L<br>
        食料：約${recommendedFood7days}食<br>
        簡易トイレ：約${recommendedToilet7days}回分<br>
        <span class="small-text">※ 保管スペースや生活環境に応じて、無理のない範囲で増やしていきましょう。</span>
      </div>

      <hr>

      <div class="section-title">不足しているもの・追加したいもの</div>
      ${shortageHtml}

      <hr>

      <div class="section-title">家族構成に応じて確認したいもの</div>
      ${personalItems.join("<br>")}

      <hr>

      <div class="section-title">改善アドバイス</div>
      ${adviceHtml}

      <div class="link-box">
        <a class="link-button" href="pdf/stock.pdf" target="_blank" rel="noopener noreferrer">サントリー社員専用備蓄品サイトはこちら</a>
      </div>
    </div>
  `;
}

function restart() {
  personsData = [];
  document.getElementById("people").value = 1;
  document.getElementById("furniture").value = "yes";
  document.getElementById("foodWater").value = "full";
  document.getElementById("toilet").value = "full";
  document.getElementById("contact").value = "yes";
  document.getElementById("result").innerHTML = "";
  showStep(1);
}
</script>



</body></html>
